server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # 1. Regra para index.html (NUNCA cachear no navegador ou proxy)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 2. Arquivos com hash gerados pelo Vite (/assets/) - podem ter cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Rota geral SPA (qualquer rota sem extensão cai no index.html sem cache)
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Proxy para direcionar chamadas de API para o container back-end no Docker Compose
    location /api {
        proxy_pass http://3dprintpng-api:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para obter imagens de upload servidas pelo Spring Boot
    location /uploads {
        proxy_pass http://3dprintpng-api:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
