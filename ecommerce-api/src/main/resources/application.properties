# Nome da aplicação
spring.application.name=ecommerce-api

# Perfil Ativo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Swagger/OpenAPI configs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Uploads de arquivos locais
app.upload.dir=${UPLOAD_DIR:./uploads}

# Criptografia
security.cryptography.secret-key=${CRYPT_SECRET_KEY}

# E-mail admin inicial
app.security.admin-first-email=${ADMIN_FIRST_EMAIL}

# Google OAuth2 Client
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# spring.security.oauth2.client.registration.google.scope=email,profile

# APIs Externas
app.external.correios.url=${CORREIOS_API_URL}
app.external.mercadopago.public-key=${MERCADO_PAGO_PUBLIC_KEY}
app.external.mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN}

server.port=8088

# Configurações de E-mail (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configurações customizadas do sistema de recuperação de senha
app.mail.from-address=${MAIL_FROM_ADDRESS:suporte@3dprintpng.com}
app.frontend.url=${FRONTEND_URL:http://192.168.15.10:3002}

